services:
  waiting:
    build:
      args:
        DEBIAN__DOCKER_IMAGE__TAG__DATE: "20260918"
      context: "."
      dockerfile: "Dockerfile"
    depends_on: {}
    env_file:
      - path: "./.env"
        required: true
    environment: {}
    volumes:
      - consistency: "consistent"
        read_only: false
        source: ".."
        target: "/home/developer/waiting"
        type: "bind"
      - consistency: "consistent"
        read_only: false
        source: "./.bashrc"
        target: "/home/developer/.bashrc"
        type: "bind"
    working_dir: "/home/developer/waiting"
volumes: {}
